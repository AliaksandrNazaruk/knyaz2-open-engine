<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Князь 2 — Кровь Титанов</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/menu.css">
</head>
<body>
  <!-- Стартовое меню. Раскладка повторяет оригинал (MENU.RES): экран 4:3,
       список пунктов лежит на плите 308x285 в тёмном проёме, каждый пункт —
       свой спрайт в двух состояниях (серебро — обычное, золото — под
       курсором). Отличие одно: вместо неподвижной картинки фон играет
       роликом. Числа top/height взяты из самих спрайтов, их печатает
       tools/menu_extract.py. -->
  <main class="stage">
    <div class="frame">
      <video class="frame__film" poster="/menu/intro-poster.jpg"
             autoplay muted loop playsinline preload="auto"
             disablepictureinpicture>
        <source src="/menu/intro.mp4" type="video/mp4">
      </video>
      <!-- виньетка по краям и мягкое затемнение под списком: буквы
           оригинала рассчитаны на почти чёрный проём, а у ролика плита
           дышит углями -->
      <div class="frame__haze" aria-hidden="true"></div>

      <nav class="menu" id="menu" aria-label="Главное меню">
        <button class="menu__item" type="button" data-action="continue"
                style="--top: 0; --height: 37">
          <img class="menu__idle" src="/menu/item-continue-idle.png" alt="Продолжить игру">
          <img class="menu__hot"  src="/menu/item-continue-hot.png"  alt="" aria-hidden="true">
        </button>
        <button class="menu__item" type="button" data-action="save"
                style="--top: 51; --height: 34">
          <img class="menu__idle" src="/menu/item-save-idle.png" alt="Сохранить игру">
          <img class="menu__hot"  src="/menu/item-save-hot.png"  alt="" aria-hidden="true">
        </button>
        <button class="menu__item" type="button" data-action="load"
                style="--top: 100; --height: 34">
          <img class="menu__idle" src="/menu/item-load-idle.png" alt="Загрузить игру">
          <img class="menu__hot"  src="/menu/item-load-hot.png"  alt="" aria-hidden="true">
        </button>
        <button class="menu__item" type="button" data-action="new"
                style="--top: 151; --height: 30">
          <img class="menu__idle" src="/menu/item-new-idle.png" alt="Новая игра">
          <img class="menu__hot"  src="/menu/item-new-hot.png"  alt="" aria-hidden="true">
        </button>
        <button class="menu__item" type="button" data-action="options"
                style="--top: 199; --height: 35">
          <img class="menu__idle" src="/menu/item-options-idle.png" alt="Настройки">
          <img class="menu__hot"  src="/menu/item-options-hot.png"  alt="" aria-hidden="true">
        </button>
        <button class="menu__item" type="button" data-action="exit"
                style="--top: 250; --height: 35">
          <img class="menu__idle" src="/menu/item-exit-idle.png" alt="Выход">
          <img class="menu__hot"  src="/menu/item-exit-hot.png"  alt="" aria-hidden="true">
        </button>
      </nav>

      <!-- НАСТРОЙКИ. Сложность — канон: множитель опыта и стартовые деньги
           берутся из неё (глобал 0x84958C). Громкость — наша, оригинал
           хранит её в KONUNG2.CFG. -->
      <section class="screen" id="screen-options" hidden aria-label="Настройки">
        <h2 class="screen__title">Настройки</h2>
        <div class="options">
          <label class="option">
            <span class="option__name">Сложность</span>
            <!-- Ступени заполняет menu.js из difficulty.js: там же лежат
                 множители, которые читает игра, — разъехаться названиям и
                 числам негде. -->
            <select class="option__input" id="opt-difficulty"></select>
            <span class="option__hint" id="opt-difficulty-hint"></span>
          </label>
          <label class="option">
            <span class="option__name">Музыка</span>
            <input class="option__input" id="opt-music" type="range"
                   min="0" max="100" step="5">
            <span class="option__hint" id="opt-music-hint"></span>
          </label>
          <label class="option">
            <span class="option__name">Звук</span>
            <input class="option__input" id="opt-sound" type="range"
                   min="0" max="100" step="5">
            <span class="option__hint" id="opt-sound-hint"></span>
          </label>
          <!-- Камера за выбранным — наша уступка телефону, а не канон: в
               оригинале камеру водит только курсор у края экрана. -->
          <label class="option">
            <span class="option__name">Камера</span>
            <input class="option__input" id="opt-follow" type="checkbox">
            <span class="option__hint" id="opt-follow-hint"></span>
          </label>
          <!-- Бег по умолчанию: с пальца двойное касание ловится плохо. -->
          <label class="option">
            <span class="option__name">Всегда бегом</span>
            <input class="option__input" id="opt-run" type="checkbox">
            <span class="option__hint" id="opt-run-hint"></span>
          </label>
          <!-- Полный экран просится на первое касание в самой игре: без
               жеста игрока браузер его не даёт (fullscreen.js). -->
          <label class="option">
            <span class="option__name">Во весь экран</span>
            <input class="option__input" id="opt-fullscreen" type="checkbox">
            <span class="option__hint" id="opt-fullscreen-hint"></span>
          </label>
          <!-- Галочка из самого движка: KONUNG2.CFG, флаг 0x8495B4. При нуле
               расчёт освещения отдаёт уровень ноль — день навсегда. -->
          <label class="option">
            <span class="option__name">Смена дня и ночи</span>
            <input class="option__input" id="opt-daynight" type="checkbox">
            <span class="option__hint" id="opt-daynight-hint"></span>
          </label>
          <!-- НАША ДОБАВКА, В ОРИГИНАЛЕ ЕЁ НЕТ. У движка проекция
               ортогональная, объёма в ней нет. Закон снят с Diablo II
               (таблица VA 0x50DCD0, разбор в docs/PERSPECTIVE.md): масштаб
               растёт линейно сверху вниз, и из этого сам собой выходит
               параллакс. Снявшему галочку возвращается ровно прежний кадр. -->
          <label class="option">
            <span class="option__name">Перспектива</span>
            <input class="option__input" id="opt-perspective" type="checkbox">
            <span class="option__hint" id="opt-perspective-hint"></span>
          </label>
          <!-- НАША ДОБАВКА, В ОРИГИНАЛЕ ЕЁ НЕТ. Сутки длятся 28 минут, и
               половина из них ночь; без ускорения проверять механики,
               завязанные на время, невозможно. Ступени заполняет menu.js из
               settings.js. -->
          <label class="option">
            <span class="option__name">Скорость игры</span>
            <select class="option__input" id="opt-speed"></select>
            <span class="option__hint" id="opt-speed-hint"></span>
          </label>
        </div>
        <button class="screen__back" type="button" data-back>Назад</button>
      </section>

      <!-- СЛОТЫ СОХРАНЕНИЙ. В движке это файлы KONUNG2.SA<N>, здесь —
           отдельные ключи хранилища браузера. -->
      <section class="screen" id="screen-slots" hidden aria-label="Сохранения">
        <h2 class="screen__title" id="slots-title">Загрузить игру</h2>
        <div class="slots" id="slots"></div>
        <!-- ФАЙЛ НА ДИСКЕ КАК ЗАПАСНОЙ ВЫХОД. Хранилище браузера чужое: его
             сносит очистка данных сайта, его нет в приватном окне, и оно своё
             у каждого адреса. Отдельными пунктами меню это не сделать —
             пункты там картинками из INTERF.RES, а поддельных спрайтов заводить
             не станем; здесь же обычные кнопки уместны. -->
        <div class="slots__file">
          <button class="screen__back" type="button" data-action="export">Выгрузить в файл</button>
          <button class="screen__back" type="button" data-action="import">Загрузить из файла</button>
        </div>
        <button class="screen__back" type="button" data-back>Назад</button>
      </section>

      <button class="sound" id="sound" type="button"
              aria-pressed="false" title="музыка меню (трек 29)">♪</button>
      <p class="hint" id="hint">↑ ↓ — выбор · Enter — подтвердить · Esc — назад в игру</p>
    </div>
  </main>

  <script type="module" src="/menu.js"></script>
</body>
</html>
